<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 JLPT 오답노트</title>
<meta name="robots" content="noindex,nofollow">

<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">

<!-- ① 디자인 (색·글꼴·레이아웃) -->
<style>
/* VOICE: 차분한 개인 공부 노트, 군더더기 없이 바로 찾고 바로 확인
   IDEA: 일본 학생이 쓰는 단어장·문법 노트 + 빨간 도장(朱) 표시
   PICTURE: 탭으로 나뉜 카드 목록 자체 — 큰 표제어, 가려진 후리가나
   COLOUR and TYPE: 흰 종이 + 먹색 글씨 + 朱色 포인트, 藍色 보조 / Klee One(표제어), Zen Kaku Gothic(일본어), Noto Sans KR(한국어)
   LAYOUT: 상단 제목 → 고정 탭·검색 → 카드 1열(넓으면 2열) */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#121317);--paper:light-dark(#f6f6f4,#1b1c21);--ink:light-dark(#1b1b1f,#ececec);--sub:light-dark(#5d6168,#a3a7ae);
 --line:light-dark(#e3e3e0,#2c2e35);--red:light-dark(#c8231b,#ff6e61);--redbg:light-dark(#fdecea,#3a1c1a);--ai:light-dark(#26408b,#8ea8ff);--aibg:light-dark(#eaf0fd,#1d2440);--ok:light-dark(#1a7f37,#5fd47f);--okbg:light-dark(#e8f5ec,#16301f);--warn:light-dark(#9a5b00,#ffc266);--warnbg:light-dark(#fff4e0,#3a2a12)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;overflow-x:clip}
[lang=ja],.ja{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif}
.kj{font-family:"Klee One","Yu Kyokasho","Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:600}
header{padding:28px max(5vw,16px) 14px;max-width:980px;margin:0 auto}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
h1 .stamp{display:inline-block;color:var(--red);border:2.5px solid var(--red);border-radius:6px;font-size:.5em;padding:2px 7px;vertical-align:middle;margin-left:8px;transform:rotate(-6deg)}
.lead{color:var(--sub);margin:0;font-size:15px}
.hub{display:inline-block;font-size:13px;color:var(--sub);text-decoration:none;line-height:32px;min-height:32px;margin:-6px 0 4px}.hub[hidden]{display:none}
@media(hover:hover){.hub:hover{color:var(--ink)}}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding:8px max(5vw,16px)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.tab b{font-size:12px;color:var(--sub);margin-left:4px;font-weight:400}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tab[aria-selected=true] b{color:var(--bg)}
.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 200px;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-height:44px}
.tg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);cursor:pointer;min-height:44px;padding:0 4px;user-select:none}
.tg input{width:18px;height:18px;accent-color:var(--red)}
main{max-width:980px;margin:0 auto;padding:16px max(5vw,16px) 60px}
.hint{font-size:13px;color:var(--sub);margin:0 0 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;background:var(--bg);scroll-margin-top:140px;transition:box-shadow .4s}
.card.flash{box-shadow:0 0 0 3px var(--red)}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.head{font-size:26px;line-height:1.9;margin:0}
.lv{font-size:12px;color:var(--ai);background:var(--aibg);border-radius:6px;padding:1px 7px}
.date{margin-left:auto;font-size:12px;color:var(--sub)}
.mean{font-size:16px;margin:2px 0 6px}
.conn{font-size:14px;color:var(--sub);margin:0 0 6px}
.ex{list-style:none;padding:0;margin:8px 0 0}
.ex li{border-left:3px solid var(--line);padding:2px 0 4px 10px;margin-bottom:6px}
.ex .j{font-size:17px;line-height:2.1}
.ex .k{font-size:14px;color:var(--sub)}
.note{font-size:14px;background:var(--paper);border-radius:10px;padding:8px 11px;margin-top:10px}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:none;color:var(--ai);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:36px}
.fr{position:relative;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--sub) 60%,transparent);text-underline-offset:5px}
.fr::after{content:attr(data-r);position:absolute;left:50%;bottom:calc(100% - .15em);transform:translateX(-50%);font-size:.5em;line-height:1;white-space:nowrap;color:var(--red);font-weight:400;visibility:hidden;pointer-events:none;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
.fr.on::after,.showall .fr::after{visibility:visible}
@media(hover:hover){.fr:hover::after{visibility:visible}}
.hid{filter:blur(7px);cursor:pointer;transition:filter .2s;user-select:none}
.hid.on,.showall .hid.rd,.nomask .hid.mn{filter:none;user-select:auto}
@media(hover:hover){.hid:hover{filter:none}}
.kcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:center}
.cell{position:relative;width:132px;height:132px;border:1.5px solid var(--sub);display:flex;align-items:center;justify-content:center;font-size:108px;background:var(--bg)}
.cell::before,.cell::after{content:"";position:absolute;border:0 dashed var(--line);pointer-events:none}
.cell::before{left:50%;top:0;bottom:0;border-left-width:1.5px}.cell::after{top:50%;left:0;right:0;border-top-width:1.5px}
.cell span{position:relative;display:block;line-height:1;transform:translateY(var(--shift,0em))}
.kinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;align-items:center}
.kinfo dt{color:var(--sub);font-size:13px}.kinfo dd{margin:0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:10px;grid-column:1/-1}
.words div{font-size:15px;border-bottom:1px dashed var(--line);padding:2px 0}
.words .ja{font-size:19px;line-height:2}
.q{font-size:17px;line-height:2.2;background:var(--paper);border-radius:10px;padding:8px 12px;margin:6px 0}
.opts{list-style:none;padding:0;margin:6px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:2px 14px;font-size:15px}
.opts li{line-height:2}
.opts .mine{color:var(--red)}.opts .mine .oj{text-decoration:line-through}
.opts .okr{display:block;margin:1px 0 8px 1.35em;font:400 13px/1.45 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--sub)}
.opts .ans{color:var(--ok);font-weight:700}
.res{font-size:14px}.res .x{color:var(--red);font-weight:700}.res .o{color:var(--ok);font-weight:700}
.why{margin:6px 0 0;padding-left:18px;font-size:15px}.why li{margin-bottom:3px}
.key{border-left:4px solid var(--red);background:var(--redbg);padding:6px 11px;margin:8px 0;border-radius:0;font-size:16px;line-height:2}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.sp{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;margin:0 0 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--sub);cursor:pointer;vertical-align:middle;line-height:0;font:inherit;-webkit-tap-highlight-color:transparent}
.sp svg{width:16px;height:16px;display:block}
.sp.big{width:38px;height:38px;align-self:center}.sp.big svg{width:19px;height:19px}
.sp.on{color:var(--red);border-color:var(--red);background:var(--redbg)}
@media(hover:hover){.sp:hover{color:var(--ink);border-color:var(--sub)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);font-size:14px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
.rs{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.rs.x{color:var(--red);background:var(--redbg)}.rs.g{color:var(--warn);background:var(--warnbg)}.rs.o{color:var(--ok);background:var(--okbg)}
.src{font-size:13px;color:var(--sub)}
.warn{font-size:12px;color:var(--warn);border:1px solid currentColor;border-radius:6px;padding:0 6px}
.bl{display:inline-block;min-width:3em;border-bottom:1.5px solid var(--ink);margin:0 .2em;text-align:center;line-height:1.3;color:var(--ai);font-weight:700}
.done{font-size:18px;line-height:2.3;margin:8px 0 2px}
.ins{background:var(--redbg);color:inherit;border-radius:4px;padding:2px 3px}
.pc+.pc{margin-left:.35em}.pc.st{color:var(--red);font-weight:700}
.tr{font-size:14px;color:var(--sub);margin:2px 0 0}
.ordl{display:inline-block;margin-left:10px;color:var(--sub)}
.miss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;font-size:13px;color:var(--sub)}
.miss b,.miss .mi{font-weight:400;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:0 8px;line-height:2.2}
.miss .mm{font:400 13px/1.3 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--sub);margin-left:6px}
.miss .mi{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;cursor:pointer;border-color:color-mix(in srgb,var(--ai) 45%,var(--line))}
@media(hover:hover){.miss .mi:hover{background:var(--aibg)}}
.more{margin-top:10px;border-top:1px dashed var(--line)}
.more>summary{cursor:pointer;color:var(--ai);font-size:14px;padding:8px 0;min-height:40px}
.card.slim .more{margin-top:2px;border-top:0}.card.slim .more>summary{font-size:16px;line-height:2.2;color:var(--ink)}
.rf{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.rf[hidden]{display:none}
.rfb{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.rfb[aria-pressed=true]{border-color:var(--ink);background:var(--paper);font-weight:700}
.rfb b{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.inst{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer}.inst[hidden]{display:none}
html.sh-open{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:30}.sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgb(0 0 0/.38)}
.sh-box{position:absolute;left:0;right:0;bottom:0;max-height:80vh;max-height:80dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgb(0 0 0/.25);padding:0 16px calc(18px + env(safe-area-inset-bottom))}
.sh-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sh-t{font-size:13px;color:var(--sub);margin-right:auto}
.sh-top button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;min-height:38px;padding:0 12px;cursor:pointer}
.sh-top button[hidden]{display:none}
.sh-top .sh-go{color:var(--ai)}
.sh-top .sh-x{width:38px;padding:0;font-size:16px}
.sh-body .card{border:0;padding:0;border-radius:0;box-shadow:none}
@media(min-width:760px){.sh-box{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(600px,92vw);max-height:84vh;border-radius:16px;padding-bottom:18px}}
footer{text-align:center;color:var(--sub);font-size:13px;padding:0 16px 40px}
@media(max-width:600px){.head{font-size:23px}.cell{width:104px;height:104px;font-size:84px}}
@media(prefers-reduced-motion:reduce){.card,.hid{transition:none}}
</style>
</head>
<body>
<!-- ② 화면 구조 (제목·탭·검색) -->
<header>
  <a class="hub" id="hub" href="../" hidden>← jws_lab</a>
  <h1>나의 JLPT 오답노트<span class="stamp ja">復習</span></h1>
  <p class="lead">물어본 단어·문법·한자와 푼 문제(✕ 틀림 · △ 찍어서 맞음 · ○ 풀어서 맞음)가 계속 쌓이는 노트예요.</p>
</header>

<div class="bar"><div class="bar-in">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="words">단어<b id="c-words"></b></button>
    <button class="tab" role="tab" data-v="grammar">문법<b id="c-grammar"></b></button>
    <button class="tab" role="tab" data-v="kanji">한자<b id="c-kanji"></b></button>
    <button class="tab" role="tab" data-v="mistakes">문제<b id="c-mistakes"></b></button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="검색 (일본어·읽기·뜻)" autocomplete="off">
    <label class="tg"><input type="checkbox" id="showall">읽기 모두 보기</label>
    <label class="tg"><input type="checkbox" id="mask">뜻 가리기</label>
    <label class="tg"><input type="checkbox" id="slow">천천히 읽기</label>
    <button type="button" class="inst" id="inst" hidden>앱으로 설치</button>
  </div>
</div></div>

<main>
  <p class="hint">점선 밑줄이 있는 한자를 탭하거나 마우스를 올리면 읽는 법이 보여요. 흐리게 가려진 부분도 탭하면 보여요. 스피커 단추를 누르면 일본어로 읽어 줘요.</p>
  <div class="rf" id="rf" hidden></div>
  <div class="list" id="list"></div>
</main>
<footer id="foot"></footer>
<div id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="sh-bg" data-close></div>
  <div class="sh-box" id="sh-box">
    <div class="sh-top"><button type="button" id="sh-back" hidden>← 뒤로</button><span class="sh-t" id="sh-t"></span><button type="button" class="sh-go" id="sh-go"></button><button type="button" class="sh-x" id="sh-x" data-close aria-label="닫기">✕</button></div>
    <div class="sh-body" id="sh-body"></div>
  </div>
</div>

<!-- ④ 기능 (탭·검색·읽기 숨김·관련 항목 이동) -->
<script>
{
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rb=s=>esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<span class="fr" data-r="$2">$1</span>');
const plain=s=>String(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$1 $2');
const views={words:'단어',grammar:'문법',kanji:'한자',mistakes:'문제'};
const byId={};for(const v in views)for(const e of D[v])byId[e.id]=[v,e];
const base=s=>String(s).replace(/\{([^|{}]+)\|[^{}]+\}/g,'$1');
const label=id=>{const x=byId[id];if(!x)return id;const e=x[1];return x[0]==='mistakes'?e.src.split('·')[1].trim().split(' ')[0]:x[0]==='kanji'?e.k:base(e.w||e.p).slice(0,22)};
const ja=s=>`<span lang="ja">${rb(s)}</span>`;
const exs=a=>a&&a.length?`<ul class="ex">${a.map(x=>`<li><div class="j" lang="ja">${rb(x[0])}${spk(x[0])}</div><div class="k hid mn">${esc(x[1])}</div></li>`).join('')}</ul>`:'';
const rels=a=>a&&a.length?`<div class="rel">${a.filter(i=>byId[i]).map(i=>`<button class="chip" data-go="${i}">${['단어','문법','한자','문제'][Object.keys(views).indexOf(byId[i][0])]} · <span lang="ja">${esc(label(i))}</span></button>`).join('')}</div>`:'';
const note=n=>n?`<div class="note">${rb(n)}</div>`:'';
/* 읽어 주기: 기기에 들어 있는 일본어 음성 사용 (인터넷·비용 없음, 누를 때만 소리) */
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a4.5 4.5 0 0 1 0 7M19 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const sayText=s=>String(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$2').replace(/(^|\n)[A-ZＡ-Ｚ]「/g,'$1').replace(/[「」]/g,'').replace(/\n/g,' ').replace(/（([ぁ-んァ-ン])）/g,'$1').replace(/[〜～]/g,'').replace(/[（(]/g,'、').replace(/[）)]/g,'').replace(/[＋／]/g,'、').replace(/^、+/,'').replace(/、{2,}/g,'、');
const spk=(s,big,lab)=>`<button type="button" class="sp${big?' big':''}" lang="ko" data-say="${esc(sayText(s))}" aria-label="${lab||'일본어로 읽기'}">${SPK}</button>`;
const SS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function'?window.speechSynthesis:null;
const isJa=v=>/^ja([-_]|$)/i.test(v.lang);
let voice=null,playing=null,curU=null,tt=0;
function pickVoice(){if(!SS)return;const vs=SS.getVoices().filter(isJa);voice=vs.find(v=>v.localService&&/Kyoko|O-ren|Otoya|Hattori|Nanami|Haruka|Ayumi/i.test(v.name))||vs.find(v=>v.localService)||vs[0]||null}
if(SS){pickVoice();if('onvoiceschanged' in SS)SS.onvoiceschanged=pickVoice}
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms||4000)}
function stopSay(){if(playing){playing.classList.remove('on');playing=null}if(SS)SS.cancel()}
function say(b){
  if(!SS){toast('이 브라우저에서는 소리 읽기가 안 돼요.');return}
  const again=playing===b;stopSay();if(again)return;
  const all=SS.getVoices();if(all.length&&!all.some(isJa)){toast('이 기기에 일본어 음성이 없어요. 기기 설정의 음성(텍스트 읽기) 메뉴에서 일본어 음성을 한 번 내려받아 주세요.');return}
  if(!voice)pickVoice();
  const u=new SpeechSynthesisUtterance(b.dataset.say);u.lang='ja-JP';if(voice)u.voice=voice;u.rate=document.getElementById('slow').checked?.7:1;
  u.onend=u.onerror=()=>{b.classList.remove('on');if(playing===b)playing=null};
  b.classList.add('on');playing=b;curU=u;if(SS.paused)SS.resume();SS.speak(u);
}
/* 문제: r = x 틀림 · g 찍어서 맞음 · o 맞음 / t:'order' = ★ 배열 문제 (ord 정답 순서, my 내 순서, st ★ 칸) */
const RS={x:'✕ 틀림',g:'△ 찍어서 맞음',o:'○ 풀어서 맞음'},RF=[['all','전체'],['x','✕ 틀림'],['g','△ 찍음'],['o','○ 맞음']];
const st=e=>RS[e.r]?e.r:'x';
const shortM=s=>String(s||'').split(' / ')[0].replace(/\s*\([^)]*\)\s*/g,' ').trim();
const isOrd=e=>e.t==='order';
const ansOf=e=>isOrd(e)?e.ord[e.st-1]:e.ans, mineOf=e=>isOrd(e)?e.my[e.st-1]:e.mine;
const blanks=e=>[1,2,3,4].map(i=>`<span class="bl">${i===e.st?'★':''}</span>`).join('');
const qHTML=e=>{const h=rb(e.q).replace(/\n/g,'<br>');return isOrd(e)?h.replace('[[]]',()=>blanks(e)):h};
const fill=e=>isOrd(e)?e.q.replace('[[]]',()=>e.ord.map(i=>e.o[i-1]).join('')):e.q.replace(/（[\s　]*）/,()=>e.o[e.ans-1]);
const fillHTML=e=>{const h=rb(e.q).replace(/\n/g,'<br>');return isOrd(e)?h.replace('[[]]',()=>`<mark class="ins">${e.ord.map((i,k)=>`<span class="pc${k+1===e.st?' st':''}">${rb(e.o[i-1])}</span>`).join('')}</mark>`):h.replace(/（[\s　]*）/,()=>`<mark class="ins"><span class="pc st">${rb(e.o[e.ans-1])}</span></mark>`)};
const R={
 words:e=>`<article class="card" id="${e.id}"><div class="top"><h2 class="head" lang="ja">${rb(e.w)}</h2>${spk(e.w,1)}<span class="date">${e.d}</span></div><p class="mean hid mn">${esc(e.m)}</p>${exs(e.ex)}${note(e.note)}${rels(e.rel)}</article>`,
 grammar:e=>`<article class="card" id="${e.id}"><div class="top"><h2 class="head" lang="ja">${rb(e.p)}</h2><span class="lv">${esc(e.lv)}</span><span class="date">${e.d}</span></div><p class="mean hid mn">${esc(e.m)}</p>${e.c?`<p class="conn">접속: ${rb(e.c)}</p>`:''}${exs(e.ex)}${note(e.note)}${rels(e.rel)}</article>`,
 kanji:e=>`<article class="card kcard" id="${e.id}"><div class="cell kj"><span>${esc(e.k)}</span></div><dl class="kinfo"><dt>음독</dt><dd class="ja hid rd" style="font-size:19px">${esc(e.on)}</dd><dt>훈독</dt><dd class="ja hid rd" style="font-size:19px">${esc(e.kun)}</dd><dt>획수</dt><dd>${e.s}획</dd><dt>부수</dt><dd lang="ja">${esc(e.r)}</dd></dl><div class="words">${e.w.map(w=>`<div><span class="ja">${rb(w[0])}</span>${spk(w[0])} <span class="hid mn">${esc(w[1])}</span></div>`).join('')}</div><div class="note" style="grid-column:1/-1;margin-top:0">${rb(e.tip)}</div></article>`,
 mistakes:e=>{const s=st(e),A=ansOf(e),M=mineOf(e),ord=isOrd(e);
  const top=`<div class="top"><span class="rs ${s}">${RS[s]}</span><span class="src">${esc(e.src)}</span>${e.warn?`<span class="warn">${esc(e.warn)}</span>`:''}<span class="date">${e.d}</span></div>`;
  const q=`<div class="q" lang="ja">${qHTML(e)}</div>`;
  const opts=`<ol class="opts" lang="ja">${e.o.map((o,i)=>`<li class="${i+1===A?'ans':i+1===M?'mine':''}"><span class="oj">${i+1}. ${rb(o)}</span>${e.ok&&e.ok[i]?`<span class="okr hid mn" lang="ko">${esc(e.ok[i])}</span>`:''}</li>`).join('')}</ol>`;
  const same=ord&&e.my.join()===e.ord.join();
  const ordl=ord?`<span class="ordl">순서 ${same?`<span class="o">${e.ord.join('-')}</span> 모두 맞음`:`내 ${e.my.join('-')} → 정답 <span class="o">${e.ord.join('-')}</span>`}</span>`:'';
  const res=`<p class="res">${A===M?`내 답 <span class="o">${M} ○</span>`:`내 답 <span class="x">${M} ✕</span> → 정답 <span class="o">${A}</span>`}${ordl}</p>`;
  const done=`<div class="done" lang="ja">${fillHTML(e)}${spk(fill(e),0,'완성 문장 읽기')}</div>`;
  const key=`<div class="key" lang="ja">${rb(e.key)}</div>`,tr=`<p class="tr hid mn">${esc(e.tr)}</p>`;
  const why=`<ul class="why">${e.why.map(w=>`<li>${rb(w)}</li>`).join('')}</ul>`;
  const miss=e.miss&&e.miss.length?`<p class="miss">모르던 것 ${e.miss.map(m=>{const [t,id,mm]=Array.isArray(m)?m:[m,null,null];const mean=mm||(id&&byId[id]?shortM(byId[id][1].m):'');const inner=`<span lang="ja">${rb(t)}</span>${mean?`<span class="mm hid mn" lang="ko">${esc(mean)}</span>`:''}`;return id&&byId[id]?`<button type="button" class="mi" data-go="${id}">${inner}</button>`:`<b>${inner}</b>`}).join('')}</p>`:'';
  const a=`<article class="card${s==='o'?' slim':''}" id="${e.id}">`;
  if(s==='x')return `${a}${top}${ord?q:`<div class="q" lang="ja">${qHTML(e)}${spk(fill(e),0,'정답을 넣어 읽기')}</div>`}${opts}${res}${ord?done:''}${key}${tr}${miss}${why}${rels(e.rel)}</article>`;
  if(s==='g')return `${a}${top}${done}${tr}${miss}${key}<details class="more"><summary>문제 · 보기 · 해설 보기</summary>${q}${opts}${res}${why}</details>${rels(e.rel)}</article>`;
  return `${a}${top}<details class="more"><summary lang="ja">${rb(e.key)}</summary>${done}${tr}${q}${opts}${res}${why}</details>${miss}${rels(e.rel)}</article>`}
};
const list=document.getElementById('list'),qi=document.getElementById('q');
let cur='words',rf='all';
try{const v=localStorage.getItem('odap-rf');if(RS[v]||v==='all')rf=v}catch(_){}
function draw(){
  const q=qi.value.trim().toLowerCase();
  for(const v in views)document.getElementById('c-'+v).textContent=D[v].length;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===cur));
  let pool=D[cur];const rfEl=document.getElementById('rf');
  if(cur==='mistakes'){const n={all:pool.length,x:0,g:0,o:0};pool.forEach(e=>n[st(e)]++);rfEl.hidden=false;
    rfEl.innerHTML=RF.map(([k,l])=>`<button type="button" class="rfb" data-rf="${k}" aria-pressed="${rf===k}">${l}<b>${n[k]}</b></button>`).join('');
    if(rf!=='all')pool=pool.filter(e=>st(e)===rf)}else rfEl.hidden=true;
  /* 최신순: 날짜가 늦은 것 먼저, 날짜가 같으면 나중에 넣은 것(배열 뒤쪽) 먼저 */
  const items=pool.map((e,i)=>[e,i]).filter(([e])=>!q||plain(JSON.stringify(e)).toLowerCase().includes(q)).sort((a,b)=>b[0].d.localeCompare(a[0].d)||b[1]-a[1]).map(x=>x[0]);
  list.innerHTML=items.length?items.map(R[cur]).join(''):`<p class="empty">${q?'검색 결과가 없어요.':cur==='mistakes'&&rf!=='all'?'이 표시의 문제는 아직 없어요.':'아직 비어 있어요.'}</p>`;
  shift();
}
function go(v){if(!views[v])v='words';cur=v;stopSay();draw()}
document.querySelector('.tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){location.hash=t.dataset.v}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
qi.addEventListener('input',draw);
document.addEventListener('click',e=>{
  const s=e.target.closest('.sp');if(s){say(s);return}
  const f=e.target.closest('[data-rf]');if(f){rf=f.dataset.rf;try{localStorage.setItem('odap-rf',rf)}catch(_){}draw();return}
  if(e.target.closest('[data-close]')){closeSheet();return}
  if(e.target.closest('#sh-back')){shStack.pop();shShow();return}
  const n=e.target.closest('[data-nav]');if(n){const id=n.dataset.nav;closeSheet();nav(id);return}
  const c=e.target.closest('[data-go]');if(c){openSheet(c.dataset.go);return}
  const r=e.target.closest('.fr');if(r){r.classList.toggle('on');return}
  const h=e.target.closest('.hid');if(h)h.classList.toggle('on');
});
const sa=document.getElementById('showall'),mk=document.getElementById('mask'),sl=document.getElementById('slow');
function opts(){document.body.classList.toggle('showall',sa.checked);document.body.classList.toggle('nomask',!mk.checked);try{localStorage.setItem('odap-opts',JSON.stringify({s:sa.checked,m:mk.checked,r:sl.checked}))}catch(_){}}
try{const o=JSON.parse(localStorage.getItem('odap-opts')||'{}');sa.checked=!!o.s;mk.checked=!!o.m;sl.checked=!!o.r}catch(_){}
sa.addEventListener('change',opts);mk.addEventListener('change',opts);sl.addEventListener('change',opts);opts();
function shift(){const el=document.querySelector('.cell span');if(!el)return;const cs=getComputedStyle(el);const x=document.createElement('canvas').getContext('2d');x.font=cs.fontWeight+' 200px '+cs.fontFamily;const m=x.measureText('田');if(typeof m.fontBoundingBoxAscent!=='number')return;document.documentElement.style.setProperty('--shift',((m.fontBoundingBoxDescent-m.fontBoundingBoxAscent+m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/400).toFixed(4)+'em')}
if(document.fonts)document.fonts.ready.then(shift);
document.getElementById('foot').textContent=`마지막 업데이트 ${D.updated} · 단어 ${D.words.length} · 문법 ${D.grammar.length} · 한자 ${D.kanji.length} · 문제 ${D.mistakes.length}`;
/* 미리보기 창: 칩·모르던 것을 누르면 먼저 여기서 보여 주고, '○○ 탭에서 보기'를 눌러야 이동 */
const sh=document.getElementById('sheet'),shBox=document.getElementById('sh-box'),shBody=document.getElementById('sh-body'),shT=document.getElementById('sh-t'),shBack=document.getElementById('sh-back'),shGo=document.getElementById('sh-go');
let shStack=[],shRet=null;
function shShow(){const id=shStack[shStack.length-1];if(!id){closeSheet();return}const [v,e]=byId[id];
  shT.textContent=views[v];shGo.textContent=`${views[v]} 탭에서 보기 →`;shGo.dataset.nav=id;shBack.hidden=shStack.length<2;
  shBody.innerHTML=R[v](e).replace(/^<article class="([^"]*)" id="[^"]*">/,'<article class="$1">');shBox.scrollTop=0;if(v==='kanji')shift()}
function openSheet(id){if(!byId[id])return;if(sh.hidden){shStack=[];shRet=document.activeElement;sh.hidden=false;document.documentElement.classList.add('sh-open')}
  if(shStack[shStack.length-1]!==id)shStack.push(id);shShow();try{document.getElementById('sh-x').focus({preventScroll:true})}catch(_){}}
function closeSheet(){if(sh.hidden)return;sh.hidden=true;document.documentElement.classList.remove('sh-open');stopSay();shStack=[];try{if(shRet&&shRet.isConnected)shRet.focus({preventScroll:true})}catch(_){}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function nav(id){const x=byId[id];if(!x)return;const [v,t]=x;qi.value='';if(v==='mistakes'&&rf!=='all'&&st(t)!==rf)rf='all';
  if(location.hash.slice(1)!==v){try{history.pushState(null,'','#'+v)}catch(_){}}go(v);
  requestAnimationFrame(()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}})}
window.addEventListener('popstate',()=>go(location.hash.slice(1)));
/* 웹앱: 오프라인 저장 + 설치 단추 (claude.ai 안에서 열면 조용히 넘어감) */
(()=>{let top=true;try{top=window.self===window.top}catch(_){top=false}
  const okHost=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!top||!okHost)return;
  if(location.pathname.replace(/[^/]*$/,'').split('/').filter(Boolean).length>=1)document.getElementById('hub').hidden=false;
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
  if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)return;
  const ib=document.getElementById('inst'),ua=navigator.userAgent;let ev=null;
  const ios=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const macSafari=!ios&&/Macintosh/.test(ua)&&/Safari/.test(ua)&&!/Chrome|Chromium|Edg|Firefox/.test(ua);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;ib.hidden=false});
  window.addEventListener('appinstalled',()=>{ib.hidden=true});
  if(ios||macSafari)ib.hidden=false;
  ib.addEventListener('click',()=>{
    if(ev){ev.prompt();ev.userChoice.finally(()=>{ev=null;ib.hidden=true});return}

})();
go(location.hash.slice(1));
