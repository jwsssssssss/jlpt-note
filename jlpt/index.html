<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 JLPT 오답노트</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JLPT 노트">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<!-- ① 디자인 (색·글꼴·레이아웃) -->
<style>
/* VOICE: 차분한 개인 공부 노트, 군더더기 없이 바로 찾고 바로 확인
   IDEA: 일본 학생이 쓰는 단어장·문법 노트 + 빨간 도장(朱) 표시
   PICTURE: 탭으로 나뉜 카드 목록 자체 — 큰 표제어, 가려진 후리가나
   COLOUR and TYPE: 흰 종이 + 먹색 글씨 + 朱色 포인트, 藍色 보조 / Klee One(표제어), Zen Kaku Gothic(일본어), Noto Sans KR(한국어)
   LAYOUT: 상단 제목 → 고정 탭·검색 → 카드 1열(넓으면 2열) */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#121317);--paper:light-dark(#f6f6f4,#1b1c21);--ink:light-dark(#1b1b1f,#ececec);--sub:light-dark(#5d6168,#a3a7ae);
 --line:light-dark(#e3e3e0,#2c2e35);--red:light-dark(#c8231b,#ff6e61);--redbg:light-dark(#fdecea,#3a1c1a);--ai:light-dark(#26408b,#8ea8ff);--aibg:light-dark(#eaf0fd,#1d2440);--ok:light-dark(#1a7f37,#5fd47f);--okbg:light-dark(#e8f5ec,#16301f);--warn:light-dark(#9a5b00,#ffc266);--warnbg:light-dark(#fff4e0,#3a2a12)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;overflow-x:clip}
[lang=ja],.ja{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif}
.kj{font-family:"Klee One","Yu Kyokasho","Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:600}
header{padding:28px max(5vw,16px) 14px;max-width:980px;margin:0 auto}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
h1 .stamp{display:inline-block;color:var(--red);border:2.5px solid var(--red);border-radius:6px;font-size:.5em;padding:2px 7px;vertical-align:middle;margin-left:8px;transform:rotate(-6deg)}
.lead{color:var(--sub);margin:0;font-size:15px}
.hub{display:inline-block;font-size:13px;color:var(--sub);text-decoration:none;line-height:32px;min-height:32px;margin:-6px 0 4px}.hub[hidden]{display:none}
@media(hover:hover){.hub:hover{color:var(--ink)}}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding:8px max(5vw,16px)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.tab b{font-size:12px;color:var(--sub);margin-left:4px;font-weight:400}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tab[aria-selected=true] b{color:var(--bg)}
.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 200px;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-height:44px}
.tg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);cursor:pointer;min-height:44px;padding:0 4px;user-select:none}
.tg input{width:18px;height:18px;accent-color:var(--red)}
main{max-width:980px;margin:0 auto;padding:16px max(5vw,16px) 60px}
.hint{font-size:13px;color:var(--sub);margin:0 0 12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;background:var(--bg);scroll-margin-top:140px;transition:box-shadow .4s}
.card.flash{box-shadow:0 0 0 3px var(--red)}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.head{font-size:26px;line-height:1.9;margin:0}
.lv{font-size:12px;color:var(--ai);background:var(--aibg);border-radius:6px;padding:1px 7px}
.date{margin-left:auto;font-size:12px;color:var(--sub)}
.mean{font-size:16px;margin:2px 0 6px}
.conn{font-size:14px;color:var(--sub);margin:0 0 6px}
.ex{list-style:none;padding:0;margin:8px 0 0}
.ex li{border-left:3px solid var(--line);padding:2px 0 4px 10px;margin-bottom:6px}
.ex .j{font-size:17px;line-height:2.1}
.ex .k{font-size:14px;color:var(--sub)}
.note{font-size:14px;background:var(--paper);border-radius:10px;padding:8px 11px;margin-top:10px}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:none;color:var(--ai);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:36px}
.fr{position:relative;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--sub) 60%,transparent);text-underline-offset:5px}
.fr::after{content:attr(data-r);position:absolute;left:50%;bottom:calc(100% - .15em);transform:translateX(-50%);font-size:.5em;line-height:1;white-space:nowrap;color:var(--red);font-weight:400;visibility:hidden;pointer-events:none;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
.fr.on::after,.showall .fr::after{visibility:visible}
@media(hover:hover){.fr:hover::after{visibility:visible}}
.hid{filter:blur(7px);cursor:pointer;transition:filter .2s;user-select:none}
.hid.on,.showall .hid.rd,.nomask .hid.mn{filter:none;user-select:auto}
@media(hover:hover){.hid:hover{filter:none}}
.kcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:center}
.cell{position:relative;width:132px;height:132px;border:1.5px solid var(--sub);display:flex;align-items:center;justify-content:center;font-size:108px;background:var(--bg)}
.cell::before,.cell::after{content:"";position:absolute;border:0 dashed var(--line);pointer-events:none}
.cell::before{left:50%;top:0;bottom:0;border-left-width:1.5px}.cell::after{top:50%;left:0;right:0;border-top-width:1.5px}
.cell span{position:relative;display:block;line-height:1;transform:translateY(var(--shift,0em))}
.kinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;align-items:center}
.kinfo dt{color:var(--sub);font-size:13px}.kinfo dd{margin:0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:10px;grid-column:1/-1}
.words div{font-size:15px;border-bottom:1px dashed var(--line);padding:2px 0}
.words .ja{font-size:19px;line-height:2}
.q{font-size:17px;line-height:2.2;background:var(--paper);border-radius:10px;padding:8px 12px;margin:6px 0}
.opts{list-style:none;padding:0;margin:6px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:2px 14px;font-size:15px}
.opts li{line-height:2}
.opts .mine{color:var(--red)}.opts .mine .oj{text-decoration:line-through}
.opts .okr{display:block;margin:1px 0 8px 1.35em;font:400 13px/1.45 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--sub)}
.opts .ans{color:var(--ok);font-weight:700}
.res{font-size:14px}.res .x{color:var(--red);font-weight:700}.res .o{color:var(--ok);font-weight:700}
.why{margin:6px 0 0;padding-left:18px;font-size:15px}.why li{margin-bottom:3px}
.key{border-left:4px solid var(--red);background:var(--redbg);padding:6px 11px;margin:8px 0;border-radius:0;font-size:16px;line-height:2}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.sp{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;margin:0 0 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--sub);cursor:pointer;vertical-align:middle;line-height:0;font:inherit;-webkit-tap-highlight-color:transparent}
.sp svg{width:16px;height:16px;display:block}
.sp.big{width:38px;height:38px;align-self:center}.sp.big svg{width:19px;height:19px}
.sp.on{color:var(--red);border-color:var(--red);background:var(--redbg)}
@media(hover:hover){.sp:hover{color:var(--ink);border-color:var(--sub)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);font-size:14px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#toast.show{opacity:1}
.rs{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.rs.x{color:var(--red);background:var(--redbg)}.rs.g{color:var(--warn);background:var(--warnbg)}.rs.o{color:var(--ok);background:var(--okbg)}
.src{font-size:13px;color:var(--sub)}
.warn{font-size:12px;color:var(--warn);border:1px solid currentColor;border-radius:6px;padding:0 6px}
.bl{display:inline-block;min-width:3em;border-bottom:1.5px solid var(--ink);margin:0 .2em;text-align:center;line-height:1.3;color:var(--ai);font-weight:700}
.done{font-size:18px;line-height:2.3;margin:8px 0 2px}
.ins{background:var(--redbg);color:inherit;border-radius:4px;padding:2px 3px}
.pc+.pc{margin-left:.35em}.pc.st{color:var(--red);font-weight:700}
.tr{font-size:14px;color:var(--sub);margin:2px 0 0}
.ordl{display:inline-block;margin-left:10px;color:var(--sub)}
.miss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;font-size:13px;color:var(--sub)}
.miss b,.miss .mi{font-weight:400;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:0 8px;line-height:2.2}
.miss .mm{font:400 13px/1.3 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--sub);margin-left:6px}
.miss .mi{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;cursor:pointer;border-color:color-mix(in srgb,var(--ai) 45%,var(--line))}
@media(hover:hover){.miss .mi:hover{background:var(--aibg)}}
.more{margin-top:10px;border-top:1px dashed var(--line)}
.more>summary{cursor:pointer;color:var(--ai);font-size:14px;padding:8px 0;min-height:40px}
.card.slim .more{margin-top:2px;border-top:0}.card.slim .more>summary{font-size:16px;line-height:2.2;color:var(--ink)}
.rf{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.rf[hidden]{display:none}
.rfb{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.rfb[aria-pressed=true]{border-color:var(--ink);background:var(--paper);font-weight:700}
.rfb b{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.inst{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer}.inst[hidden]{display:none}
html.sh-open{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:30}.sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgb(0 0 0/.38)}
.sh-box{position:absolute;left:0;right:0;bottom:0;max-height:80vh;max-height:80dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgb(0 0 0/.25);padding:0 16px calc(18px + env(safe-area-inset-bottom))}
.sh-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sh-t{font-size:13px;color:var(--sub);margin-right:auto}
.sh-top button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;min-height:38px;padding:0 12px;cursor:pointer}
.sh-top button[hidden]{display:none}
.sh-top .sh-go{color:var(--ai)}
.sh-top .sh-x{width:38px;padding:0;font-size:16px}
.sh-body .card{border:0;padding:0;border-radius:0;box-shadow:none}
.kw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.kw-w{font-size:30px;font-weight:700;line-height:1.3}.kw-r{font-size:16px;color:var(--red)}
.kw-m{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kc{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kc-c{display:flex;align-items:center;justify-content:center;font-size:58px;height:78px;border:1.5px solid var(--line);border-radius:10px}.kc-c span{display:block;line-height:1;transform:translateY(calc(var(--shift,0em) + .04em))}
.kc-ko{font-size:18px}.kc-old{font-size:13px;color:var(--sub);margin-left:8px}
.kc-rd{font-size:15px;display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:2px}.kc-rd i{font-style:normal;font-size:12px;color:var(--sub);font-family:"Noto Sans KR",sans-serif}
.kc-rad{font-size:14px;color:var(--sub);margin-top:2px}
.kc-ws{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}.kc-ws>span{font-size:12px;color:var(--sub);width:100%}
.kwb{font-size:16px;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer;line-height:1.6}
.kwb small{font-size:11px;color:var(--sub);margin-left:5px}
.kc .chip{margin-top:8px}.cell[data-kw]{cursor:pointer}
.qzbtn{flex:none;border:1.5px solid var(--red);background:var(--bg);color:var(--red);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:44px}
.memb{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--sub);border-radius:999px;padding:0 11px;min-height:32px;cursor:pointer}
.memb.on{color:var(--ok);border-color:var(--ok);background:var(--okbg);font-weight:700}
.tact{font:inherit;font-size:14px;font-weight:700;color:inherit;background:none;border:1px solid currentColor;border-radius:999px;padding:2px 10px;margin-left:8px;cursor:pointer}
html.qz-open{overflow:hidden}
.qz{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;overscroll-behavior:contain}.qz[hidden]{display:none}
.qz-in{max-width:760px;margin:0 auto;padding:0 max(5vw,16px) calc(40px + env(safe-area-inset-bottom))}
.qz-top{position:sticky;top:0;z-index:1;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.qz-top b{font-size:17px}.qz-top span{color:var(--sub);font-size:14px;margin-right:auto}
.qz-x{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;cursor:pointer}
.qz-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}.qz-bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.qz-tag{display:inline-block;font-size:12px;color:var(--ai);background:var(--aibg);border-radius:6px;padding:1px 8px;margin:0 0 10px}
.qz-h{font-size:22px;margin:0 0 4px}
.qz-in h3{font-size:14px;color:var(--sub);margin:20px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer}
.seg button[aria-pressed=true]{border:2px solid var(--ink);font-weight:700;background:var(--bg)}
.qz-note{font-size:14px;color:var(--sub);margin:16px 0 0}
.qz-inst{font-size:15px;line-height:1.7;margin:0 0 12px}
.qz-stem{font-size:20px;line-height:2.3;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.qz-stem .qu{text-decoration:underline 2px;text-underline-offset:6px;text-decoration-skip-ink:none}
.qz-stem .qw{font-size:30px;font-weight:700}
.qz-opts{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.qo{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:18px;line-height:1.7;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:58px;cursor:pointer}
@media(hover:hover){.qo:not(:disabled):hover{border-color:var(--sub);background:var(--paper)}}
.qn{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:14px;font-weight:700;line-height:1}
.qo.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.qo.ng{border-color:var(--red);background:var(--redbg);color:var(--red)}
.qo:disabled{cursor:default}
.qf{margin:20px 0 8px;font-size:18px;font-weight:700}.qf.ok{color:var(--ok)}.qf.ng{color:var(--red)}
.qf-ex{font-size:18px;line-height:2.2}
.qf-m{font-size:15px;margin:8px 0}.qf-m b{font-size:18px;margin-right:6px}
.qf-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.qnext{font:inherit;font-size:16px;font-weight:700;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 20px;min-height:48px;cursor:pointer;margin-left:auto}
.qnext:disabled{opacity:.4;cursor:default}
.qsec{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer}
.qscore{font-size:20px;margin:6px 0}.qscore b{font-size:48px}.qpct{color:var(--sub);margin:0 0 10px}
@media(prefers-reduced-motion:reduce){.qz-bar i{transition:none}}
@media(min-width:760px){.sh-box{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(600px,92vw);max-height:84vh;border-radius:16px;padding-bottom:18px}}
footer{text-align:center;color:var(--sub);font-size:13px;padding:0 16px 40px}
@media(max-width:600px){.head{font-size:23px}.cell{width:104px;height:104px;font-size:84px}}
@media(prefers-reduced-motion:reduce){.card,.hid{transition:none}}
</style>
</head>
<body>
<!-- ② 화면 구조 (제목·탭·검색) -->
<header>
  <a class="hub" id="hub" href="../" hidden>← jws-lab</a>
  <h1>나의 JLPT 오답노트<span class="stamp ja">復習</span></h1>
  <p class="lead">물어본 단어·문법·한자와 푼 문제(✕ 틀림 · △ 찍어서 맞음 · ○ 풀어서 맞음)가 계속 쌓이는 노트예요.</p>
</header>

<div class="bar"><div class="bar-in">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="words">단어<b id="c-words"></b></button>
    <button class="tab" role="tab" data-v="grammar">문법<b id="c-grammar"></b></button>
    <button class="tab" role="tab" data-v="kanji">한자<b id="c-kanji"></b></button>
    <button class="tab" role="tab" data-v="mistakes">문제<b id="c-mistakes"></b></button>
  </div>

{"id":"g-karashite","p":"Nからして","lv":"N2","m":"① N부터가 (대표 예) ② N로 보아 (판단 근거)","c":"명사＋からして","ex":[["リーダーからしてやる{気|き}がないのだから、ほかの{人|ひと}たちがやるはずがない。","리더부터가 의욕이 없으니 다른 사람들이 할 리가 없다."],["この{店|みせ}は{店員|てんいん}の{態度|たいど}からして{悪|わる}い。","이 가게는 점원 태도부터가 나쁘다."],["{体|からだ}じゅうからあふれる{表現力|ひょうげんりょく}からして、{君|きみ}には{俳優|はいゆう}としての{素質|そしつ}があると{思|おも}う。","온몸에서 넘쳐 나는 표현력으로 보아, 너에게는 배우로서의 소질이 있다고 생각해."]],"note":"「にしては」(~치고는)와 구별: リーダーにしては = 리더치고는(예상과 다름) / リーダーからして = 리더부터가(그러니 다른 사람은 더). 「〜からすると」(~로 보아)와도 달라요. ② 「〜からして」는 '~로 보아'(판단의 근거)로도 써요: {表現力|ひょうげんりょく}からして{素質|そしつ}がある(표현력으로 보아 소질이 있다). 이때는 「〜からすると」와 비슷해요.","rel":["m-q1","m-p265-11","g-karasuruto"],"d":"2026-11-22"},
{"id":"g-omoigasuru","p":"〜{思|おも}いがする","lv":"N2","m":"~한 기분(느낌)이 들다, ~한 심정이다","c":"동사・い형용사 보통형＋思いがする","ex":[["{身|み}の{引|ひ}き{締|し}まる{思|おも}いがします。","마음이 다잡아지는 기분이 듭니다."],["{胸|むね}が{痛|いた}む{思|おも}いがした。","가슴이 아픈 심정이었다."]],"note":"비슷한 말 「〜{気|き}がする」. {考|かんが}え・{見込|みこ}み는 「がする」와 같이 쓰지 않아요.","rel":["m-q4","w-minohikishimaru"],"d":"2026-11-22"},
{"id":"g-buri","p":"Nぶり／ます{形|けい}＋ぶり","lv":"N2","m":"~하는 모습·태도 / (기간＋ぶり) ~만에","c":"명사・동사 ます형＋ぶり (회화: 〜っぷり) / 기간＋ぶり","ex":[["{彼|かれ}の{仕事|しごと}ぶりは{真面目|まじめ}だ。","그의 일하는 태도는 성실하다."],["{見事|みごと}な{食|た}べっぷりだね。","먹는 모습이 아주 시원시원하네."],["3{年|ねん}ぶりに{国|くに}へ{帰|かえ}った。","3년 만에 고국에 돌아갔다."]],"note":"뜻이 두 가지예요. ① 모습·태도: {話|はな}しぶり(말투), {暮|く}らしぶり(사는 모습) ② 기간＋ぶり '~만에': {久|ひさ}しぶり(오랜만). 「〜っぷり」는 기세 좋은 느낌({飲|の}みっぷり).","rel":["w-shigotoburi"],"d":"2026-11-22"},
{"id":"g-toittaraarya","p":"〜といったらありゃしない／〜といったらない","lv":"N1","m":"너무너무 ~하다, ~하기 짝이 없다 (말로 다 못 할 정도)","c":"い형용사 사전형・な형용사 어간・명사＋といったら(ありゃし)ない","ex":[["ばかばかしいといったらありゃしない。","어처구니없기 짝이 없다."],["{朝|あさ}の{満員電車|まんいんでんしゃ}は{苦|くる}しいといったらない。","아침 만원 전철은 괴롭기 이를 데 없다."],["{一人|ひとり}で{留守番|るすばん}するのは{心細|こころぼそ}いといったらありゃしない。","혼자 집 보는 건 너무너무 불안하다."]],"note":"「ありゃしない」는 「ありはしない」의 회화체라 불만·짜증 같은 나쁜 느낌에 주로 써요. 「〜といったらない」는 좋은 뜻에도 써요 ({嬉|うれ}しいといったらない). 「〜ったらない」로 줄이기도 해요.","rel":["w-bakabakashii"],"d":"2026-11-22"},
{"id":"g-tokade","p":"〜とかで","lv":"N2","m":"~라면서, ~라나 해서 (남에게 들은 이유를 전함)","c":"보통형＋とかで (명사・な형용사는 〜だとかで)","ex":[["{急用|きゅうよう}ができたとかで、ただいま{帰|かえ}りました。","급한 볼일이 생겼다면서 방금 돌아갔습니다."],["{体調|たいちょう}が{悪|わる}いとかで、{田中|たなか}さんは{今日|きょう}{休|やす}んでいる。","몸이 안 좋다나 해서 다나카 씨는 오늘 쉬고 있다."]],"note":"직접 확인한 게 아니라 들은 이유라서 조금 흐릿한 느낌. 같은 계열: 문장 끝의 「〜とか」(~라나 봐: {明日|あした}は{雨|あめ}だとか). 뒤에는 그 사람이 한 일·상태가 와요.","rel":["w-kyuuyou","w-tadaima"],"d":"2026-11-22"},
{"id":"g-youtosuru","p":"〜（よ）うとする","lv":"N3","m":"~하려고 하다 (막 하려는 참)","c":"동사 의지형(〜よう／〜おう)＋とする","ex":[["ちょうど{出|で}かけようとしていたところへ、{国|くに}の{母|はは}から{小包|こづつみ}が{届|とど}いた。","마침 외출하려던 참에, 고향의 어머니에게서 소포가 도착했다."],["{寝|ね}ようとしたら、{電話|でんわ}が{鳴|な}った。","자려고 했더니 전화가 울렸다."]],"note":"의지형으로 만들어요: {出|で}かける→{出|で}かけよう, {行|い}く→{行|い}こう, する→しよう. 「{出|で}かけるようとする」✕ (사전형＋よう가 아니에요).","rel":["g-tokoroe"],"d":"2026-11-22"},
{"id":"g-tokoroe","p":"〜ところへ／〜ところに","lv":"N2","m":"마침 ~하고 있을 때(에) — 다른 일이 끼어듦","c":"동사 사전형・た형・ている형・(よ)うとしている＋ところへ／に","ex":[["ちょうど{出|で}かけようとしていたところへ、{国|くに}の{母|はは}から{小包|こづつみ}が{届|とど}いた。","마침 외출하려던 참에, 고향의 어머니에게서 소포가 도착했다."],["{食事|しょくじ}をしているところへ、{友達|ともだち}が{来|き}た。","밥을 먹고 있는데 친구가 왔다."]],"note":"뒤에는 '누가 오다·연락이 오다·일이 생기다'처럼 그 상황에 끼어드는 일이 와요. 「〜ところを」는 '~하는 장면을'({危|あぶ}ないところを{助|たす}けられた)이라 달라요.","rel":["g-youtosuru","w-kozutsumi"],"d":"2026-11-22"},
{"id":"g-tomonashini","p":"〜ともなしに／〜ともなく","lv":"N1","m":"딱히 ~하려던 건 아닌데 (무심코) / 의문사＋ともなく: 어디선지·언제인지 모르게","c":"동사 사전형＋ともなしに・ともなく (뒤에 같은 동사) / 의문사(＋조사)＋ともなく","ex":[["テレビを{見|み}るともなしに{見|み}ていたら、{友達|ともだち}が{映|うつ}っていた。","TV를 딱히 보려던 건 아니고 그냥 보고 있었는데, 친구가 나왔다."],["{聞|き}くともなく{隣|となり}の{話|はなし}を{聞|き}いてしまった。","들으려던 건 아닌데 옆 사람 이야기를 듣고 말았다."],["どこからともなくいい{匂|にお}いがしてきた。","어디선가 좋은 냄새가 났다."]],"note":"{見|み}る・{聞|き}く・{言|い}う・{考|かんが}える와 짝: 見るともなしに見る. ともなしに와 ともなく는 같은 뜻이고 ともなく가 더 자주 쓰여요. 의문사 쪽은 ともなく만: いつからともなく(언제부터인지 모르게), {誰|だれ}からともなく(누가 먼저랄 것 없이).","rel":[],"d":"2026-11-22"},
{"id":"g-naidemonai","p":"〜ないでもない／〜なくもない","lv":"N2","m":"~하지 않는 것도 아니다, 조금은 ~하다 (약한 긍정)","c":"동사・형용사 ない형＋でもない／〜なくもない (명사: 〜でなくもない)","ex":[["{彼|かれ}の{気持|きも}ちも{分|わ}からないでもない。","그의 마음도 모르는 건 아니다."],["{条件|じょうけん}によっては{引|ひ}き{受|う}けなくもない。","조건에 따라서는 맡지 않을 것도 없다."],["{言|い}われてみれば、{似|に}ていなくもない。","듣고 보니 닮지 않은 것도 아니다."]],"note":"이중부정이라 '조금은 그렇다'는 소극적인 긍정이에요. 망설이거나 돌려 말할 때: わからないでもない・{考|かんが}えないでもない・{行|い}かなくもない. い형용사: {高|たか}くなくもない.","rel":[],"d":"2026-11-22"},
{"id":"g-nagaramo","p":"〜ながらも","lv":"N2","m":"~하면서도, ~이지만 (역접)","c":"동사 ます형・い형용사 사전형・な형용사 어간・명사＋ながらも","ex":[["{狭|せま}いながらも{楽|たの}しい{我|わ}が{家|や}。","좁지만 즐거운 우리 집."],["{知|し}っていながらも、{何|なに}も{言|い}わなかった。","알면서도 아무 말도 하지 않았다."],["{子|こ}どもながらも、しっかりした{考|かんが}えを{持|も}っている。","아이지만 야무진 생각을 갖고 있다."]],"note":"그냥 「ながら」는 '~하면서'(동시 동작)지만, も를 붙인 「ながらも」는 '~인데도'라는 역접이 분명해요. 비슷한 말: 〜つつも, 〜にもかかわらず. 「{残念|ざんねん}ながら」(유감스럽게도)처럼 굳은 표현도 있어요.","rel":[],"d":"2026-11-22"},
{"id":"g-naraizashirazu","p":"〜ならいざ{知|し}らず","lv":"N1","m":"~라면 몰라도 (그런 경우라면 이해하지만, 이 경우는…)","c":"명사＋ならいざ知らず / 보통형＋の(ん)ならいざ知らず","ex":[["{子|こ}どもならいざ{知|し}らず、{大人|おとな}がそんなことをするなんて。","아이라면 몰라도, 어른이 그런 짓을 하다니."],["{初心者|しょしんしゃ}ならいざ{知|し}らず、プロがこんな{失敗|しっぱい}をするとは{思|おも}わなかった。","초보라면 몰라도, 프로가 이런 실수를 할 줄은 몰랐다."]],"note":"앞에 '그럴 수도 있는 특별한 경우', 뒤에 '이 경우는 그럴 수 없다'(비판·놀람)가 와요. 「〜ならともかく」와 거의 같은 뜻이고 더 딱딱한 말이에요. 「いざ」를 「いら」로 쓰지 않게 주의.","rel":["g-naratomokaku"],"d":"2026-11-22"},
{"id":"g-naratomokaku","p":"〜ならともかく","lv":"N2","m":"~라면 몰라도","c":"명사＋ならともかく / 보통형＋の(ん)ならともかく","ex":[["{一日|いちにち}ならともかく、{一週間|いっしゅうかん}も{休|やす}むのは{無理|むり}だ。","하루라면 몰라도, 일주일이나 쉬는 건 무리다."],["{冗談|じょうだん}ならともかく、{本気|ほんき}で{言|い}っているなら{問題|もんだい}だ。","농담이라면 몰라도, 진심으로 하는 말이라면 문제다."]],"note":"「AはともかくB」(A는 차치하고 B)와 같은 뿌리. 「ともかく」를 「ともなく」로 쓰면 전혀 다른 문법(〜ともなく: 무심코 ~하다)이 되니 주의. 더 딱딱한 말은 「〜ならいざ{知|し}らず」.","rel":["g-naraizashirazu","g-tomonashini"],"d":"2026-11-22"},
{"id":"g-naimademo","p":"〜ないまでも","lv":"N1","m":"~까지는 아니더라도 (적어도 ~)","c":"동사 ない형＋までも (〜とは{言|い}わないまでも・〜にはならないまでも)","ex":[["プロとは{言|い}わないまでも、{素人|しろうと}とは{思|おも}えないほど{手品|てじな}がうまい。","프로까지는 아니더라도, 아마추어라고는 생각할 수 없을 만큼 마술을 잘한다."],["{毎日|まいにち}とは{言|い}わないまでも、{週|しゅう}に{一度|いちど}は{運動|うんどう}したい。","매일까지는 아니더라도, 일주일에 한 번은 운동하고 싶다."],["プロにはならないまでも、{趣味|しゅみ}として{続|つづ}けたい。","프로까지는 되지 않더라도, 취미로 계속하고 싶다."]],"note":"앞에 '높은 수준', 뒤에 '그보다는 낮지만 적어도 이 정도'가 와요. 「ならないまでも」= なる의 ない형＋までも. 뒤에 「せめて」「{少|すく}なくとも」와 자주 짝이에요.","rel":["w-tejina","w-shirouto"],"d":"2026-11-22"},
{"id":"g-nioite","p":"〜において／〜における","lv":"N2","m":"~에서 (장소·때·분야 — 딱딱한 で)","c":"명사＋において / 명사＋における＋명사","ex":[["{卒業式|そつぎょうしき}は{体育館|たいいくかん}において９{時|じ}より{開催|かいさい}します。","졸업식은 체육관에서 9시부터 개최합니다."],["{現代|げんだい}の{社会|しゃかい}における{問題|もんだい}を{考|かんが}える。","현대 사회에서의 문제를 생각한다."]],"note":"공지·뉴스·논문처럼 딱딱한 글에서 で 대신 써요. 뒤에 명사가 오면 「における」. 비슷한 공문 말투로 「〜にて」(〜にて{開催|かいさい})도 있어요.","rel":["g-yori","w-kaisai","m-p265-13"],"d":"2026-11-22"},

{"id":"m-q14","t":"order","r":"o","src":"문법공략편 제3장 問題6 · 14번 (문법 063)","q":"{高|たか}い{所|ところ}から{見下|みお}ろすパリの{景色|けしき}は{最高|さいこう}です。{数々|かずかず}の{映画|えいが}の[[]]{一枚|いちまい}を{撮|と}ってみてはいかがでしょうか。","o":["{舞台|ぶたい}ともなった","{主人公|しゅじんこう}になりきったかの","{場所|ばしょ}で{映画|えいが}の","ような"],"ok":["무대가 되기도 한","주인공이 완전히 된 듯(한)","장소에서 영화의","~같은"],"st":3,"ord":[1,3,2,4],"my":[1,3,2,4],"key":"Nの{舞台|ぶたい}ともなった{場所|ばしょ} ＋ 〜になりきったかのような＋N","tr":"높은 곳에서 내려다보는 파리의 경치는 최고입니다. 수많은 영화의 무대가 되기도 했던 곳에서, 영화 주인공이 된 듯한 사진 한 장을 찍어 보는 건 어떨까요?","miss":[["{見下|みお}ろす","w-miorosu"],["{数々|かずかず}","w-kazukazu"]],"why":["「{映画|えいが}の」 뒤에는 명사 → {舞台|ぶたい}ともなった(무대가 되기도 한) ＋ {場所|ばしょ}で","「かの」 뒤에는 ような → 〜かのような(마치 ~인 듯한)＋{一枚|いちまい}","なりきる: 완전히 ~가 되다 ({主人公|しゅじんこう}になりきる: 주인공이 된 기분으로)"],"rel":["w-miorosu","w-kazukazu"],"d":"2026-11-22"},
{"id":"m-q15","t":"order","r":"o","src":"문법공략편 제3장 問題6 · 15번 (문법 070)","q":"「{乗|の}り{掛|か}かった{船|ふね}」ということわざは、{乗|の}って{岸|きし}を{離|はな}れた{船|ふね}からは{下船|げせん}できない[[]]ことのたとえである。","o":["{物事|ものごと}を{始|はじ}めてしまった","{以上|いじょう}","{途中|とちゅう}でやめるわけにはいかない","ところから"],"ok":["일을 시작해 버린","~한 이상","중간에 그만둘 수는 없다","~라는 데서 (말이 생긴 까닭)"],"st":3,"ord":[4,1,2,3],"my":[4,1,2,3],"key":"〜ところから(~라는 데서) ＋ 〜た{以上|いじょう}(~한 이상) ＋ 〜わけにはいかない","tr":"'올라탄 배'라는 속담은, 타고서 물가를 떠난 배에서는 내릴 수 없다는 데서, 일을 시작한 이상 중간에 그만둘 수는 없다는 것을 빗댄 말이다.","miss":[["ことわざ","w-kotowaza"],["{岸|きし}","w-kishi"],["{離|はな}れる","w-hanareru"],["{下船|げせん}","w-gesen"]],"why":["「{下船|げせん}できない」 뒤 → ところから(~라는 데서: 말이 생긴 까닭)","た형＋{以上|いじょう}: ~한 이상 → {始|はじ}めてしまった{以上|いじょう}","{以上|いじょう} 뒤에는 당연한 결론 → {途中|とちゅう}でやめるわけにはいかない","「{乗|の}り{掛|か}かった{船|ふね}」= 이왕 시작한 일이라 중간에 그만둘 수 없음"],"rel":["w-kotowaza","w-kishi","w-hanareru","w-gesen","g-wakenihaikanai"],"d":"2026-11-22"},
{"id":"m-q1","r":"x","src":"문법공략편 제3장 問題5 · 1번 (문법 067)","q":"リーダー（　）やる{気|き}があまりにもないのだから、ほかの{人|ひと}たちがやるはずがない。","o":["までしても","とともに","にしては","からして"],"ok":["~까지 해도","~와 함께, ~함에 따라","~치고는 (예상과 다름)","~부터가 (대표 예)"],"mine":1,"ans":4,"key":"Nからして ＋ 〜のだから、ほかは〜はずがない","tr":"리더부터가 의욕이 너무 없으니, 다른 사람들이 할 리가 없다.","why":["「〜のだから、ほかの{人|ひと}たちが〜はずがない」: 대표(리더)를 들어 '다른 사람은 더더욱'이라는 구조 → からして(~부터가)","1 までしても '~까지 해도': 뒤에 '그래도 안 된다' 같은 노력의 결과가 와야 해요.","3 にしては '~치고는': 「リーダーにしてはやる気がない」까지는 되지만, 뒤의 '그러니 다른 사람도'로 이어지지 않아요.","2 とともに '~와 함께': 뜻이 안 맞아요."],"rel":["g-karashite"],"d":"2026-11-22"},
{"id":"m-q2","r":"o","src":"문법공략편 제3장 問題5 · 2번 (문법 052)","q":"{多|おお}くの{医者|いしゃ}にかかったのだが、{何|なん}のかいもないばかりか、ますます{悪|わる}くなる（　）。","o":["{一方|いっぽう}だ","{気味|ぎみ}だ","{以上|いじょう}だ","{次第|しだい}だ"],"ok":["~하기만 한다 (한 방향으로 계속)","~한 기미다, 좀 ~한 느낌이다","~한 이상이다 / 이상입니다","~에 달렸다 / ~한 경위다"],"mine":1,"ans":1,"key":"ますます〜なる＋{一方|いっぽう}だ","tr":"여러 의사에게 진찰받았지만 아무 보람도 없을 뿐 아니라, 점점 나빠지기만 한다.","miss":[["{医者|いしゃ}にかかる","w-ishanikakaru"],["ますます","w-masumasu"]],"why":["「ますます〜なる」(점점 ~해지다)와 짝 → 〜{一方|いっぽう}だ(계속 그쪽으로만 간다)","2 {気味|ぎみ}だ: 명사·ます형＋気味({風邪|かぜ}{気味|ぎみ}). 사전형＋気味だ는 안 돼요.","3 {以上|いじょう}だ / 4 {次第|しだい}だ: 뜻이 안 맞아요.","{何|なん}のかいもない: 아무 보람(효과)도 없다 / 〜ばかりか: ~뿐 아니라"],"rel":["w-ishanikakaru","w-masumasu"],"d":"2026-11-22"},
{"id":"m-q3","r":"o","src":"문법공략편 제3장 問題5 · 3번 (문법 054)","q":"{今年|ことし}は{夏|なつ}が{涼|すず}しかった（　）{冷房|れいぼう}はほとんど{使|つか}わずにすんだ。","o":["うえで","ためで","おかげで","くせに"],"ok":["~한 후에 / ~하는 데 있어","ため＋で (이 자리에선 안 쓰는 꼴)","~덕분에 (좋은 결과)","~주제에, ~인데도 (비난)"],"mine":3,"ans":3,"key":"〜おかげで ＋ 〜ずにすむ(~하지 않고 끝나다)","tr":"올해는 여름이 시원했던 덕분에 냉방은 거의 쓰지 않고 지나갔다.","miss":[["{冷房|れいぼう}","w-reibou"]],"why":["뒤가 좋은 결과(냉방을 안 써도 됐다) → おかげで","4 くせに는 비난, 1 うえで는 '~한 후에'라서 안 맞아요.","2 ためで: 원인은 「ために／ため」로 써요. 「ためで」는 이 자리에 오지 않아요.","〜ずにすむ: ~하지 않고 끝나다, ~안 해도 되다"],"rel":["w-reibou"],"d":"2026-11-22"},
{"id":"m-q4","r":"x","src":"문법공략편 제3장 問題5 · 4번 (문법 056)","q":"{明日|あした}の{初出勤日|はつしゅっきんび}のことを{思|おも}うと{身|み}の{引|ひ}き{締|し}まる（　）がします。","o":["{始末|しまつ}","{思|おも}い","{見込|みこ}み","{考|かんが}え"],"ok":["(나쁜) 결과, 꼴","느낌, 심정 (〜思いがする)","전망, 가망","생각"],"mine":3,"ans":2,"key":"{身|み}の{引|ひ}き{締|し}まる{思|おも}いがする","tr":"내일 첫 출근 날을 생각하면 마음이 다잡아지는 기분이 듭니다.","miss":[["{初出勤日|はつしゅっきんび}","w-hatsushukkinbi"],["{身|み}の{引|ひ}き{締|し}まる{思|おも}い","w-minohikishimaru"],["{見込|みこ}み","w-mikomi"]],"why":["「（　）がします」 → 느낌을 나타내는 〜{思|おも}いがする(~한 기분이 들다)","「{身|み}の{引|ひ}き{締|し}まる{思|おも}い」는 한 덩어리 표현이에요.","3 {見込|みこ}み는 '전망'이라 「見込みがある／〜見込みだ」로 써요. 「がします」와 안 어울려요.","1 {始末|しまつ}는 '(결국 나쁜) 꼴', 4 {考|かんが}え는 「考えがある」로 써서 둘 다 안 맞아요."],"rel":["g-omoigasuru","w-minohikishimaru","w-mikomi","w-hatsushukkinbi"],"d":"2026-11-22"},
{"id":"m-p264-6","r":"o","src":"문법공략편 제3장 p.264 · 6번 (문법 061)","q":"{僕|ぼく}が{小学校|しょうがっこう}に（　）の{頃|ころ}に{祖父|そふ}が{脳溢血|のういっけつ}で{寝|ね}たきりになりました。","o":["{入|はい}るか{入|はい}らないか","{入|はい}っていてもいなくても","{入|はい}ろうが{入|はい}るまいが","{入|はい}るにしても{入|はい}らないにしても"],"ok":["막 들어갈까 말까 할 (무렵)","들어가 있든 없든","들어가든 말든 (상관없이)","들어간다 해도 안 들어간다 해도 (어느 쪽이든)"],"mine":1,"ans":1,"key":"동사 사전형＋か＋ない형＋か(の{頃|ころ}・のうちに): 막 ~할까 말까 할 때","tr":"내가 초등학교에 들어갈까 말까 할 무렵에 할아버지가 뇌출혈로 몸져누우셨습니다.","why":["「〜の{頃|ころ}」 앞에는 '때'를 나타내는 말 → {入|はい}るか{入|はい}らないか(막 들어갈 무렵)","2·3·4는 모두 '~하든 ~하든 상관없이'라서 「の{頃|ころ}」와 안 어울려요.","{寝|ね}たきり: 병으로 누워만 지내는 상태"],"rel":["g-nishitemo2"],"d":"2026-11-22"},
{"id":"m-p264-7","r":"x","src":"문법공략편 제3장 p.264 · 7번 (문법 065)","q":"A「『{働|はたら}く』を{楽|たの}しむために{必要|ひつよう}なことは{何|なん}だと{思|おも}いますか。」\nB「{今|いま}は{僕|ぼく}らの{頃|ころ}より{一人当|ひとりあ}たりの{仕事|しごと}の{量|りょう}が{広|ひろ}い{時代|じだい}。なので、{経営者|けいえいしゃ}という{立場|たちば}（　）、{楽|たの}しむ{余裕|よゆう}よりも、しっかりと{仕事|しごと}をやりぬくことの{方|ほう}が{大切|たいせつ}に{思|おも}えたりします。」","o":["に{言|い}わせていれば","から{言|い}わせてもらえば","に{言|い}わせてあげれば","から{言|い}わせてやれば"],"ok":["(이렇게는 쓰지 않음)","~의 입장에서 말씀드리자면","(남에게) 말하게 해 준다면","말하게 해 준다면 (상대를 낮춤)"],"mine":4,"ans":2,"key":"Nから{言|い}わせてもらえば (＝Nに{言|い}わせれば): ~의 입장에서 말하자면","tr":"A: '일하는 것'을 즐기기 위해 필요한 건 뭐라고 생각하세요? B: 지금은 우리 때보다 1인당 일의 양이 많은 시대예요. 그래서 경영자라는 입장에서 말씀드리자면, 즐길 여유보다 일을 끝까지 확실히 해내는 게 더 중요하게 느껴지기도 해요.","why":["자기 의견을 겸손하게 말할 때 → 〜から{言|い}わせてもらえば(제 입장에서 말씀드리자면)","〜てもらう는 '허락받아 말씀드린다'는 겸손한 느낌, 〜てやる는 상대를 낮추는 말이라 4는 무례해요.","「Nに{言|い}わせれば」도 같은 뜻이지만, 1처럼 「{言|い}わせていれば」라고는 하지 않아요.","3 「{言|い}わせてあげれば」는 '남에게 말하게 해 주면'이라 뜻이 달라요."],"rel":["g-karaiwasete"],"d":"2026-11-22"},
