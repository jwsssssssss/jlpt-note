<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jws_lab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="jws_lab">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#121317);--paper:light-dark(#f6f6f4,#1b1c21);--ink:light-dark(#1b1b1f,#ececec);
 --sub:light-dark(#5d6168,#a3a7ae);--line:light-dark(#e3e3e0,#2c2e35);--ai:light-dark(#26408b,#8ea8ff)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo",sans-serif}
main{max-width:880px;margin:0 auto;padding:36px max(5vw,16px) 48px}
h1{font-size:clamp(28px,5vw,38px);line-height:1.15;margin:0 0 6px}
.lead{margin:0 0 26px;color:var(--sub);font-size:15px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px;list-style:none;margin:0;padding:0}
.app{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;min-height:88px;transition:border-color .15s,background .15s}
@media(hover:hover){.app:hover{border-color:var(--sub);background:var(--paper)}}
.app:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.app img{width:56px;height:56px;border-radius:14px;flex:none}
.app b{display:block;font-size:17px;line-height:1.35}
.app span{display:block;font-size:14px;color:var(--sub);line-height:1.45;margin-top:2px}
footer{margin-top:30px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;color:var(--sub);font-size:13px}
.inst{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer}
.inst[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);font-size:14px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.app,#toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>jws_lab</h1>
  <p class="lead">직접 만든 웹앱을 한곳에 모아 둔 첫 화면이에요.</p>
  <!-- 새 웹앱을 만들면: site/<폴더>/ 에 앱을 넣고, 아래에 <li> 카드 하나를 추가해요. -->
  <ul class="apps">
    <li><a class="app" href="jlpt/"><img src="jlpt/icons/icon-192.png" alt=""><div><b>JLPT 오답노트</b><span>단어 · 문법 · 한자와 푼 문제를 모아 두는 복습 노트</span></div></a></li>
  </ul>
  <footer>
    <span>새 웹앱을 만들면 여기에 카드가 하나씩 늘어나요.</span>
    <button type="button" class="inst" id="inst" hidden>이 화면을 앱으로 설치</button>
  </footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const okHost=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!okHost)return;
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
  if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)return;
  const ib=document.getElementById('inst'),t=document.getElementById('toast'),ua=navigator.userAgent;let ev=null,tt=0;
  const toast=m=>{t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),8000)};
  const ios=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const macSafari=!ios&&/Macintosh/.test(ua)&&/Safari/.test(ua)&&!/Chrome|Chromium|Edg|Firefox/.test(ua);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;ib.hidden=false});
  window.addEventListener('appinstalled',()=>{ib.hidden=true});
  if(ios||macSafari)ib.hidden=false;
  ib.addEventListener('click',()=>{
    if(ev){ev.prompt();ev.userChoice.finally(()=>{ev=null;ib.hidden=true});return}
    toast(ios?'공유 단추(네모에 위쪽 화살표) → ‘홈 화면에 추가’를 누르면 앱처럼 쓸 수 있어요.':'Safari 메뉴의 ‘파일’ → ‘Dock에 추가’를 누르면 앱처럼 쓸 수 있어요.')});
})();
</script>
</body>
</html>
