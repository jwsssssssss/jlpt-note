<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jws-lab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="jws-lab">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#121317);--paper:light-dark(#f6f6f4,#1b1c21);--ink:light-dark(#1b1b1f,#ececec);
 --sub:light-dark(#5d6168,#a3a7ae);--line:light-dark(#e6e6e2,#2c2e35);--ai:light-dark(#26408b,#8ea8ff);
 --hl:light-dark(#d3e2a6,#55663a);--matcha:light-dark(#5b7430,#c2d892);--wash:light-dark(#f4f8ec,#171b13)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;word-break:keep-all}
a{color:inherit}
.hl{background:linear-gradient(176deg,transparent 56%,var(--hl) 56% 90%,transparent 90%);padding:0 .06em;margin:0 -.03em}
.inst{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:0 16px;min-height:42px;cursor:pointer}
@media(hover:hover){.inst:hover{border-color:var(--sub)}}
.inst:focus-visible,a:focus-visible{outline:3px solid var(--ai);outline-offset:3px}
.inst[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);font-size:14px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

main{max-width:640px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:clamp(32px,7vw,56px) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.top{display:flex;gap:16px;align-items:center}
.mark{width:clamp(60px,12vw,72px);height:auto;aspect-ratio:1;border-radius:22%;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{font-size:clamp(30px,6.5vw,40px);line-height:1.12;letter-spacing:-.02em;margin:0 0 4px}
.lead{margin:0;color:var(--sub);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0;padding:0;list-style:none}
.chips li{font-size:12.5px;font-weight:700;color:var(--matcha);background:var(--wash);border-radius:999px;padding:3px 10px}
.apps{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:18px;border:1px solid var(--line);border-radius:22px;text-decoration:none;background:var(--bg);transition:border-color .15s,box-shadow .15s}
@media(hover:hover){.card:hover{border-color:var(--sub);box-shadow:0 10px 28px rgba(0,0,0,.06)}}
.card img{width:64px;height:64px;border-radius:16px;grid-row:span 2;box-shadow:0 0 0 1px var(--line)}
.card b{font-size:18px;line-height:1.3;align-self:end}
.card .d{font-size:14px;color:var(--sub);line-height:1.45}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--paper);border-radius:14px;padding:10px 6px;text-align:center}
.stats strong{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--sub)}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--sub)}
.go{font-weight:700;color:var(--ink);background:var(--wash);border-radius:999px;padding:4px 12px}
footer{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="top"><img class="mark" src="icons/icon-192.png" alt=""><div><h1>jws-<span class="hl">lab</span></h1><p class="lead">직접 만든 웹앱을 한곳에 모아 둔 첫 화면이에요.</p></div></div>
  <ul class="chips"><li id="app-count">웹앱 1개</li><li>오프라인에서도 열려요</li><li>홈 화면에 설치</li></ul>
  <!-- 새 웹앱을 만들면: site/<폴더>/ 에 앱을 넣고, 아래 <ul class="apps"> 에 <li> 카드 하나를 추가해요.
       (메인 sw.js 의 CORE 에 그 앱의 icons/icon-192.png 도 넣고 캐시 이름 숫자를 올려요) -->
  <ul class="apps">
    <li><a class="card" href="jlpt/"><img src="jlpt/icons/icon-192.png" alt=""><b>JLPT 오답노트</b><span class="d">단어 · 문법 · 한자와 푼 문제를 모아 두는 복습 노트</span>
      <div class="stats" id="jlpt-stats"><div><strong data-k="words">—</strong><span>단어</span></div><div><strong data-k="grammar">—</strong><span>문법</span></div><div><strong data-k="kanji">—</strong><span>한자</span></div><div><strong data-k="mistakes">—</strong><span>문제</span></div></div>
      <div class="meta"><span id="jlpt-upd">&nbsp;</span><span class="go">열기 →</span></div></a></li>
  </ul>
  <footer><span>새 웹앱을 만들면 카드가 하나씩 늘어나요.</span><button type="button" class="inst" id="inst" hidden>이 화면을 앱으로 설치</button></footer>
</main>
<script>
// 웹앱 개수 칩: 카드 수를 셈
(()=>{const n=document.querySelectorAll('.apps > li').length,el=document.getElementById('app-count');if(el)el.textContent=`웹앱 ${n}개`})();
// JLPT 노트 현황: 노트 페이지의 데이터 블록에서 개수 · 갱신일을 읽어 카드에 보여 줌.
// 못 읽으면(오프라인 등) 이 기기에 마지막으로 본 숫자를 보여 주고, 그것도 없으면 숫자 칸을 숨김.
(()=>{const box=document.getElementById('jlpt-stats'),upd=document.getElementById('jlpt-upd'),KEY='jwslab-jlpt-stats';
 const show=(c,u,old)=>{box.querySelectorAll('[data-k]').forEach(el=>{const v=c[el.dataset.k];el.textContent=v==null?'—':v});
  if(u){const [y,mo,da]=u.split('-').map(Number);upd.textContent=`${mo}월 ${da}일 갱신`+(old?' · 마지막으로 본 숫자':'')}};
 fetch('jlpt/',{cache:'no-cache'}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{
  const m=t.match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/);if(!m)throw 0;const d=JSON.parse(m[1]);
  const c={};['words','grammar','kanji','mistakes'].forEach(k=>{if(Array.isArray(d[k]))c[k]=d[k].length});
  show(c,d.updated,false);try{localStorage.setItem(KEY,JSON.stringify({c,u:d.updated}))}catch(_){}
 }).catch(()=>{let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}
  if(s&&s.c)show(s.c,s.u,true);else box.hidden=true});
})();
</script>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const okHost=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!okHost)return;
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
  if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)return;
  const ib=document.getElementById('inst'),t=document.getElementById('toast'),ua=navigator.userAgent;let ev=null,tt=0;
  const toast=m=>{t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),8000)};
  const ios=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const macSafari=!ios&&/Macintosh/.test(ua)&&/Safari/.test(ua)&&!/Chrome|Chromium|Edg|Firefox/.test(ua);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;ib.hidden=false});
  window.addEventListener('appinstalled',()=>{ib.hidden=true});
  if(ios||macSafari)ib.hidden=false;
  ib.addEventListener('click',()=>{
    if(ev){ev.prompt();ev.userChoice.finally(()=>{ev=null;ib.hidden=true});return}
    toast(ios?'공유 단추(네모에 위쪽 화살표) → ‘홈 화면에 추가’를 누르면 앱처럼 쓸 수 있어요.':'Safari 메뉴의 ‘파일’ → ‘Dock에 추가’를 누르면 앱처럼 쓸 수 있어요.')});
})();
</script>
</body>
</html>
